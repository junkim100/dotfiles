##### Indexing #####
# start with window 1 (instead of 0)
set -g base-index 1

# start with pane 1
set -g pane-base-index 1


##### Splits and windows (stay in same path) #####
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

unbind '"'
unbind %

# open new windows in the current path
bind c new-window -c "#{pane_current_path}"


##### Reload #####
bind r source-file ~/.tmux.conf


##### Navigation #####
unbind p
bind p previous-window


##### Responsiveness #####
# shorten escape delay (helps ESC in Vim and Alt-key chords feel snappier)
set -sg escape-time 1


##### Window naming #####
# don't rename windows automatically
set -g allow-rename off


##### Mouse #####
# mouse control (clickable windows, panes, resizable panes)
set -g mouse on


##### Pane switching (Alt + arrows) #####
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D


##### Copy mode #####
# enable vi mode keys
set-window-option -g mode-keys vi


##### Colors (truecolor) #####
# If your tmux supports it, this is often the most correct TERM inside tmux.
set -g default-terminal "tmux-256color"

# Enable truecolor for terminals that advertise xterm-like capabilities.
# If you see color issues, change * to match your outer $TERM prefix (e.g. xterm*, screen*, etc.).
set -as terminal-overrides ",*:Tc"


##### URL picker #####
# present a menu of URLs to open from the visible pane
bind u capture-pane \;\
    save-buffer /tmp/tmux-buffer \;\
    split-window -l 10 "urlview /tmp/tmux-buffer"


##### TPM plugins #####
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'nordtheme/tmux'

# Nord theme options (set before TPM 'run' line)
# Nord docs note variables should be set before the plugin is loaded by TPM. [web:150]
set -g @nord_tmux_show_status_content "1"
# If powerline glyphs look broken, enable this:
# set -g @nord_tmux_no_patched_font "1"   # disables patched font characters. [web:165][web:167]

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

