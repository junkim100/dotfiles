##### Indexing #####
# start with window 1 (instead of 0)
set -g base-index 1

# start with pane 1
set -g pane-base-index 1


##### Splits and windows (stay in same path) #####
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

unbind '"'
unbind %

# open new windows in the current path
bind c new-window -c "#{pane_current_path}"


##### Reload #####
bind r source-file ~/.tmux.conf


##### Navigation #####
unbind p
bind p previous-window


##### Responsiveness #####
set -sg escape-time 1


##### Window naming #####
set -g allow-rename off


##### Mouse #####
set -g mouse on


##### Pane switching (Alt + arrows) #####
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D


##### Copy mode #####
set-window-option -g mode-keys vi


##### Colors (truecolor) #####
# Many setups use tmux-256color inside tmux for correct capabilities. [web:242]
set -g default-terminal "tmux-256color"

# Tell tmux truecolor is supported (adjust the pattern if needed). [web:242]
set -as terminal-overrides ",*:Tc"


##### URL picker #####
bind u capture-pane \;\
    save-buffer /tmp/tmux-buffer \;\
    split-window -l 10 "urlview /tmp/tmux-buffer"


##### Nord theme options #####
# Nord docs: set these before the plugin line so they apply when the theme loads. [web:150]
set -g @nord_tmux_show_status_content "1"
# If you do not have a patched font for powerline glyphs, enable this. [web:150][web:165]
# set -g @nord_tmux_no_patched_font "1"


##### TPM plugins #####
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'nordtheme/tmux'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf). [web:156]
run '~/.tmux/plugins/tpm/tpm'

