name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # scripts/check skips its zsh, tmux, and jq assertions when the binary is absent,
      # so install them to keep CI coverage equal to a local run.
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh tmux jq

      - name: Run repository check
        run: ./scripts/check
